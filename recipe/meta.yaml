{% set name = "libdiffpy" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/diffpy/{{ name }}/archive/{{ version }}.tar.gz
  sha256: 10331cb02f304e83d15a3cacae6db1942867b335c709772632052c4255edd2e1

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - scons
  host:
    - libboost-devel
    - gsl
    - libobjcryst
    - dlfcn-win32  # [win]
  run:
    - gsl

test:
  commands:
    - test -f $PREFIX/lib/libdiffpy${SHLIB_EXT}  # [not win]
    - if not exist %LIBRARY_LIB%\\diffpy.lib exit 1  # [win]

about:
  home: https://github.com/diffpy/libdiffpy
  summary: "C++ calculators of PDF, bond valence sum and other pair quantities."
  license: BSD-3-Clause
  license_file: LICENSE.txt
  doc_url: https://www.diffpy.org/libdiffpy/
  dev_url: https://github.com/diffpy/libdiffpy

extra:
  recipe-maintainers:
    - Tieqiong
    - pavoljuhas
    - sbillinge
    - st3107
